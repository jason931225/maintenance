name: Set up Buck2
description: >
  Install the repository-pinned DotSlash runtime and the system toolchains
  tools/buck2 resolves against. Buck2 itself is version-pinned by tools/buck2, so
  CI and the warm cache always agree on a version — a mismatch would silently
  change action digests and fragment the cache.
runs:
  using: composite
  steps:
    - name: Install pinned DotSlash runtime
      shell: bash
      run: tools/buck/install_dotslash.sh

    # toolchains/BUCK uses `system_rust_toolchain`, i.e. whatever rustc is on
    # PATH. Until 2026-09-10 this action installed no Rust at all and merely
    # PRINTED the version, so the Buck2 graph compiled with whatever the runner
    # image happened to ship. GitHub's fleet served rustc 1.98.0 and 1.98.1
    # concurrently, and because the CAS key carries no compiler identity, an
    # rlib built by one was handed to the other: `error[E0514]: found crate
    # unicode_ident compiled by an incompatible version of rustc`. Every run on
    # 1.98.0 failed and every run on 1.98.1 passed, which read as a flake for
    # weeks (#1083). Installing the pin makes the compiler deterministic, which
    # is the half of that defect this repository owns.
    - name: Install the pinned Rust toolchain
      uses: ./.github/actions/setup-rust

    - name: Ensure toolchains//:cxx resolves
      shell: bash
      run: |
        set -euo pipefail
        # toolchains/BUCK hardcodes /usr/bin/clang and /usr/bin/clang++.
        if [ ! -x /usr/bin/clang ] || [ ! -x /usr/bin/clang++ ]; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang
        fi
        /usr/bin/clang --version | head -1
        # Informational now. setup-rust owns the proof, and it does it properly:
        # from the workspace, with RUSTUP_TOOLCHAIN unset and RUSTUP_AUTO_INSTALL=0,
        # failing if rustup has anything left to download. An earlier revision
        # claimed these two lines proved buck2 and cargo agree; they never did.
        command -v rustc
        rustc --version
        tools/buck2 --version
