name: In-runner warm cache
description: >
  Run a cache-only NativeLink inside the runner, seeded from the GitHub Actions
  cache, so one runner reuses what an earlier runner built. A cache MISS never
  fails the job -- but scoping does: if the compilers that will read this store
  cannot be identified, the step exits non-zero rather than serve an unkeyed
  cache. The description previously said "never fails the job" while the file
  already had several hard exits, which is the kind of promise a caller relies on.
inputs:
  max-bytes:
    description: >
      CAS eviction cap. Deliberately small: the repo shares a ~10 GB Actions cache
      budget with a hard fail at 8 GiB (see cache-hygiene.yml), and v0-rust-/node-cache-
      are protected from eviction. This store must stay a minor tenant.
    required: false
    default: "1073741824"   # 1 GiB
  key-prefix:
    description: >
      Cache key prefix. Must NOT be one of cache-hygiene's KEEP_PREFIXES, so the
      daily protocol can always reclaim this store under budget pressure.
    required: false
    default: nativelink-cas-linux-x64-
outputs:
  endpoint:
    description: host:port of the in-runner cache.
    value: 127.0.0.1:50051
  restored-key:
    description: Cache key actually restored, empty on a miss.
    value: ${{ steps.restore.outputs.cache-matched-key }}
  key-prefix:
    description: >
      The compiler-scoped prefix actually used. A seed job that saves this store
      MUST save under this, or the save and the restore stop agreeing.
    value: ${{ steps.scope.outputs.prefix }}
runs:
  using: composite
  steps:
    # The compiler is part of this cache's identity, and it was not.
    #
    # Buck2 stores rlibs, and an rlib is only linkable by the compiler that
    # built it. GitHub's fleet served rustc 1.98.0 and 1.98.1 concurrently, the
    # key carried no compiler, and `restore-keys` matched by bare prefix -- so a
    # store accumulated artifacts from both and handed one compiler's rlib to
    # the other: `error[E0514]: found crate unicode_ident compiled by an
    # incompatible version of rustc`. Every run on one version failed, every run
    # on the other passed, and it read as a flake for weeks (#1083).
    #
    # Pinning the toolchain removes the nondeterminism but NOT the mixed store:
    # it makes the mismatch permanent instead of intermittent, because a pinned
    # compiler now differs from the cached artifacts on every single run. So the
    # compiler has to be in the key. A version this runner cannot link against
    # is then a cache MISS -- a slow build -- rather than a poisoned hit.
    # The C compiler needs the same treatment, for the same reason (#1088).
    # `toolchains/BUCK` sets `linker = "/usr/bin/clang"`, so EVERY Rust binary
    # and test in the graph links through an ambient clang -- the exposure is
    # not limited to the crates that compile C. Those actions are cacheable and
    # were keyed on rustc alone, so two runners with the same rustc and a
    # different clang shared a prefix. That is #1083's shape one language over,
    # and it would surface as a link error naming something unrelated.
    #
    # This is the cheap half of the fix: it turns a mis-hit into a miss. It does
    # NOT make the graph hermetic -- `system_cxx_toolchain` takes a path string,
    # not an artifact, so clang is still resolved at execution time and is still
    # absent from every action digest. Projecting clang out of a hash-pinned
    # archive, as toolchains//rust now does for rustc, remains the real fix.
    # (`toolchains` is a cell -- see .buckconfig -- so the label is
    # `toolchains//rust`, not `//toolchains/rust`.)
    - name: Scope the cache to the compilers that will read it
      id: scope
      shell: bash
      run: |
        set -euo pipefail
        # EVERY component is a fixed-width digest, and that is the point rather
        # than tidiness. `-` is both the separator inside a component and the
        # terminator between components, so a variable-width component makes
        # `<X>-` a strict prefix of `<X>-<Y>-` -- and `restore-keys` below is
        # PREFIX-matched. A first revision of this step transliterated clang's
        # version line, which meant `cc-clang-version-18.1.8-` prefix-matched a
        # store saved by `cc-clang-version-18.1.8-https-github.com-llvm-...-`:
        # a cross-compiler restore, reintroduced by the very step meant to stop
        # one. Fixed width removes the ambiguity by construction.
        #
        # The human-readable values are printed below, so debuggability is kept
        # in the log rather than in the key where it can collide.
        digest() { printf '%s' "$1" | sha256sum | cut -c1-12; }

        # rustc. Since #1094 buck2 does NOT resolve this from PATH -- the
        # compiler is an artifact projected from the hash-pinned sysroot, so it
        # is inside every Rust action's digest already and a mismatch is a miss
        # on its own. This component is therefore defence in depth, not the load
        # bearing part; it also keeps the store partitioned for the cargo legs.
        rustc_line=$(rustc --version)
        case "$rustc_line" in
          "rustc "*) ;;
          *) echo "::error::unrecognised rustc --version output: $rustc_line"; exit 1 ;;
        esac

        # clang is the load-bearing one. `system_cxx_toolchain` takes a path
        # string, not an artifact, so the C compiler is in NO action digest --
        # and toolchains/BUCK sets `linker = "/usr/bin/clang"`, so every Rust
        # binary and test links through it, not just the crates that compile C.
        # Read the binary toolchains/BUCK actually names, not whatever `clang`
        # resolves to on PATH: keying on a different clang than the one that
        # links would describe a store nothing produced.
        cc_bin=/usr/bin/clang
        [ -x "$cc_bin" ] || { echo "::error::$cc_bin is missing or not executable; toolchains/BUCK links every target with it"; exit 1; }
        # Captured whole, then cut at the first newline with parameter
        # expansion. No pipeline: `head -1` closing the pipe early raises the
        # SIGPIPE-under-pipefail question for nothing, and a `sed` that fails to
        # match passes its input through unchanged, so the emptiness guard it
        # was paired with could never fire.
        cc_out=$("$cc_bin" --version) || { echo "::error::$cc_bin --version failed"; exit 1; }
        cc_line=${cc_out%%$'\n'*}
        [ -n "$cc_line" ] || { echo "::error::$cc_bin --version printed nothing to scope the cache"; exit 1; }

        # Assigned, not inlined. A command substitution used as an ARGUMENT does
        # not propagate its exit status to the enclosing command: `printf`
        # returns 0 regardless, so `set -e` never fires. With `digest` broken --
        # say sha256sum unresolvable -- both substitutions yield empty and this
        # step SUCCEEDS while emitting `...rustc--cc--`: a fixed prefix,
        # identical on every runner that hits the path, which is the unkeyed
        # shared store this step exists to end. A standalone assignment does
        # fire, and that is the only difference between the two forms.
        rustc_key=$(digest "$rustc_line")
        cc_key=$(digest "$cc_line")
        printf 'prefix=%srustc-%s-cc-%s-\n' "${{ inputs.key-prefix }}" "$rustc_key" "$cc_key" >> "$GITHUB_OUTPUT"
        printf 'cache scoped to:\n  rustc: %s\n  cc:    %s\n' "$rustc_line" "$cc_line"
        # Also to the run summary, because stdout is the wrong place for it.
        # An operator meets this prefix in canary-verdict's BROKEN / NEW PREFIX
        # lines and in prune's "deleting $key" -- and prune is a DIFFERENT job,
        # so there is no adjacent translation from digest back to compiler
        # anywhere. The summary is per-run rather than per-step, so it is.
        {
          printf '### CAS cache scope\n\n'
          printf '| component | digest | version |\n|---|---|---|\n'
          printf '| rustc | `%s` | %s |\n' "$rustc_key" "$rustc_line"
          printf '| cc | `%s` | %s |\n' "$cc_key" "$cc_line"
        } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

    - name: Restore CAS
      id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/nativelink-cas
        key: ${{ steps.scope.outputs.prefix }}${{ github.run_id }}
        # Prefix-matched, but now the prefix names a compiler, so this can only
        # ever restore artifacts the current rustc can link.
        restore-keys: ${{ steps.scope.outputs.prefix }}

    - name: Install checksum-pinned NativeLink
      shell: bash
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/nativelink.tar.gz"
        curl --disable --fail --silent --show-error --location \
          "https://github.com/TraceMachina/nativelink/releases/download/v1.6.5/nativelink-1.6.5-x86_64-unknown-linux-musl.tar.gz" \
          --output "$archive"
        printf '%s  %s\n' '093d2e0baac5311444762449b703a45b738d570065d2e17c2db1fcf39d8ad051' "$archive" | sha256sum --check
        tar -xzf "$archive" -C "${RUNNER_TEMP}"
        sudo install -m 0755 "${RUNNER_TEMP}/nativelink" /usr/local/bin/nativelink
        nativelink --version

    - name: Start cache-only NativeLink
      shell: bash
      env:
        MAX_BYTES: ${{ inputs.max-bytes }}
      run: |
        set -euo pipefail
        data="${HOME}/nativelink-cas"
        mkdir -p "$data"/cas/content "$data"/cas/tmp "$data"/ac/content "$data"/ac/tmp
        cat > "${RUNNER_TEMP}/cas.json5" <<EOF
        {
          stores: [
            { name: "CAS_MAIN_STORE", filesystem: {
                content_path: "${data}/cas/content", temp_path: "${data}/cas/tmp",
                eviction_policy: { max_bytes: ${MAX_BYTES} } } },
            { name: "AC_MAIN_STORE", filesystem: {
                content_path: "${data}/ac/content", temp_path: "${data}/ac/tmp",
                eviction_policy: { max_bytes: 200000000 } } },
          ],
          schedulers: [], workers: [],
          servers: [
            { name: "public", listener: { http: { socket_address: "127.0.0.1:50051" } },
              services: {
                cas: [{ instance_name: "main", cas_store: "CAS_MAIN_STORE" }],
                ac: [{ instance_name: "main", ac_store: "AC_MAIN_STORE" }],
                bytestream: [{ instance_name: "main", cas_store: "CAS_MAIN_STORE" }],
                capabilities: [{ instance_name: "main" }],
              } },
            { name: "private", listener: { http: { socket_address: "127.0.0.1:50061" } },
              services: { health: {}, admin: {} } },
          ],
          global: { max_open_files: 24576 },
        }
        EOF
        nohup nativelink "${RUNNER_TEMP}/cas.json5" > "${RUNNER_TEMP}/nativelink.log" 2>&1 &
        for i in $(seq 1 30); do
          if curl -sf -m 2 http://127.0.0.1:50061/status >/dev/null; then
            echo "in-runner CAS healthy after ${i}s"; exit 0
          fi
          sleep 1
        done
        echo "in-runner CAS did not become healthy; the preflight probe will fall back"
        tail -20 "${RUNNER_TEMP}/nativelink.log" || true
