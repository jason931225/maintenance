name: In-runner warm cache
description: >
  Run a cache-only NativeLink inside the runner, seeded from the GitHub Actions
  cache, so one runner reuses what an earlier runner built. Never fails the job.
inputs:
  max-bytes:
    description: >
      CAS eviction cap. Deliberately small: the repo shares a ~10 GB Actions cache
      budget with a hard fail at 8 GiB (see cache-hygiene.yml), and v0-rust-/node-cache-
      are protected from eviction. This store must stay a minor tenant.
    required: false
    default: "1073741824"   # 1 GiB
  key-prefix:
    description: >
      Cache key prefix. Must NOT be one of cache-hygiene's KEEP_PREFIXES, so the
      daily protocol can always reclaim this store under budget pressure.
    required: false
    default: nativelink-cas-linux-x64-
outputs:
  endpoint:
    description: host:port of the in-runner cache.
    value: 127.0.0.1:50051
  restored-key:
    description: Cache key actually restored, empty on a miss.
    value: ${{ steps.restore.outputs.cache-matched-key }}
  key-prefix:
    description: >
      The compiler-scoped prefix actually used. A seed job that saves this store
      MUST save under this, or the save and the restore stop agreeing.
    value: ${{ steps.scope.outputs.prefix }}
runs:
  using: composite
  steps:
    # The compiler is part of this cache's identity, and it was not.
    #
    # Buck2 stores rlibs, and an rlib is only linkable by the compiler that
    # built it. GitHub's fleet served rustc 1.98.0 and 1.98.1 concurrently, the
    # key carried no compiler, and `restore-keys` matched by bare prefix -- so a
    # store accumulated artifacts from both and handed one compiler's rlib to
    # the other: `error[E0514]: found crate unicode_ident compiled by an
    # incompatible version of rustc`. Every run on one version failed, every run
    # on the other passed, and it read as a flake for weeks (#1083).
    #
    # Pinning the toolchain removes the nondeterminism but NOT the mixed store:
    # it makes the mismatch permanent instead of intermittent, because a pinned
    # compiler now differs from the cached artifacts on every single run. So the
    # compiler has to be in the key. A version this runner cannot link against
    # is then a cache MISS -- a slow build -- rather than a poisoned hit.
    - name: Scope the cache to the compiler that will read it
      id: scope
      shell: bash
      run: |
        set -euo pipefail
        # Whatever rustc buck2 will actually resolve, not what a pin file says:
        # the store must be keyed on the binary that links its contents.
        version=$(rustc --version | sed -E 's/^rustc ([^ ]+) \(([0-9a-f]+).*/\1-\2/')
        [ -n "$version" ] || { echo "::error::could not read rustc --version to scope the cache"; exit 1; }
        printf 'prefix=%srustc-%s-\n' "${{ inputs.key-prefix }}" "$version" >> "$GITHUB_OUTPUT"
        printf 'cache scoped to rustc %s\n' "$version"

    - name: Restore CAS
      id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/nativelink-cas
        key: ${{ steps.scope.outputs.prefix }}${{ github.run_id }}
        # Prefix-matched, but now the prefix names a compiler, so this can only
        # ever restore artifacts the current rustc can link.
        restore-keys: ${{ steps.scope.outputs.prefix }}

    - name: Install checksum-pinned NativeLink
      shell: bash
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/nativelink.tar.gz"
        curl --disable --fail --silent --show-error --location \
          "https://github.com/TraceMachina/nativelink/releases/download/v1.6.5/nativelink-1.6.5-x86_64-unknown-linux-musl.tar.gz" \
          --output "$archive"
        printf '%s  %s\n' '093d2e0baac5311444762449b703a45b738d570065d2e17c2db1fcf39d8ad051' "$archive" | sha256sum --check
        tar -xzf "$archive" -C "${RUNNER_TEMP}"
        sudo install -m 0755 "${RUNNER_TEMP}/nativelink" /usr/local/bin/nativelink
        nativelink --version

    - name: Start cache-only NativeLink
      shell: bash
      env:
        MAX_BYTES: ${{ inputs.max-bytes }}
      run: |
        set -euo pipefail
        data="${HOME}/nativelink-cas"
        mkdir -p "$data"/cas/content "$data"/cas/tmp "$data"/ac/content "$data"/ac/tmp
        cat > "${RUNNER_TEMP}/cas.json5" <<EOF
        {
          stores: [
            { name: "CAS_MAIN_STORE", filesystem: {
                content_path: "${data}/cas/content", temp_path: "${data}/cas/tmp",
                eviction_policy: { max_bytes: ${MAX_BYTES} } } },
            { name: "AC_MAIN_STORE", filesystem: {
                content_path: "${data}/ac/content", temp_path: "${data}/ac/tmp",
                eviction_policy: { max_bytes: 200000000 } } },
          ],
          schedulers: [], workers: [],
          servers: [
            { name: "public", listener: { http: { socket_address: "127.0.0.1:50051" } },
              services: {
                cas: [{ instance_name: "main", cas_store: "CAS_MAIN_STORE" }],
                ac: [{ instance_name: "main", ac_store: "AC_MAIN_STORE" }],
                bytestream: [{ instance_name: "main", cas_store: "CAS_MAIN_STORE" }],
                capabilities: [{ instance_name: "main" }],
              } },
            { name: "private", listener: { http: { socket_address: "127.0.0.1:50061" } },
              services: { health: {}, admin: {} } },
          ],
          global: { max_open_files: 24576 },
        }
        EOF
        nohup nativelink "${RUNNER_TEMP}/cas.json5" > "${RUNNER_TEMP}/nativelink.log" 2>&1 &
        for i in $(seq 1 30); do
          if curl -sf -m 2 http://127.0.0.1:50061/status >/dev/null; then
            echo "in-runner CAS healthy after ${i}s"; exit 0
          fi
          sleep 1
        done
        echo "in-runner CAS did not become healthy; the preflight probe will fall back"
        tail -20 "${RUNNER_TEMP}/nativelink.log" || true
