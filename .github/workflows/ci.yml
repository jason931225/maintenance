    # evaluated on push/workflow_dispatch when run_heavy is true.
    #
    # The display name below is now LOAD-BEARING: branch protection matches the
    # required context on that literal string, so renaming this job without
    # updating the protection contexts in the same change silently un-requires
    # it and restores the false-green this comment used to describe.
    #
    # S1/S2: aggregator only. Facet jobs run the suite; this job fails closed if
    # any facet is not success. Do not matrix this display name.
    name: Dispatch, attendance and ontology — disposable PostgreSQL reachability
    needs:
      - preflight
      - postgres-reachability-app
      - postgres-reachability-platform
      - postgres-reachability-ontology
      - postgres-reachability-domain-a
      - postgres-reachability-domain-b
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preflight failure non-evaluation
        if: ${{ needs.preflight.result != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'PostgreSQL reachability not evaluated because preflight result=%s\n' "${{ needs.preflight.result }}"
      - name: Path-class skip proof
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.run_live_postgres != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'path-class skip proof: %s not required for class=%s\n' "${GITHUB_JOB}" "${{ needs.preflight.outputs.path_class }}"
      - name: Require all PostgreSQL reachability facets
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.run_live_postgres == 'true' }}
        run: |
          test "${{ needs.postgres-reachability-app.result }}" = success &&
          test "${{ needs.postgres-reachability-platform.result }}" = success &&
          test "${{ needs.postgres-reachability-ontology.result }}" = success &&
          test "${{ needs.postgres-reachability-domain-a.result }}" = success &&
          test "${{ needs.postgres-reachability-domain-b.result }}" = success

  company-conformance:
    # Generic ontology instance-engine regression. Twelve scenario ids and five
    # controls. Postsubmit: runs on push/workflow_dispatch when run_heavy, not
    # on the merge-blocking Required / CI fan-in (4–6m suite).
    #
    # This is not the current Company/HR product target: all five fixtures are
    # instance-backed, Person is absent, and the suite proves no projected owning
    # port or single-writer boundary. Twice it also could not distinguish a
    # correct mechanism from a wrong one; adapter-postgres mechanism tests cover
    # those blind spots. A green result must not dispatch the projected fan-out.
    name: Company conformance — generic-engine regression
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.run_heavy == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    timeout-minutes: 35

    steps:
      - name: Path-class skip proof
        if: ${{ needs.preflight.outputs.run_heavy != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'path-class skip proof: %s not required for class=%s\n' "${GITHUB_JOB}" "${{ needs.preflight.outputs.path_class }}"
      - name: Checkout
        if: ${{ needs.preflight.outputs.run_heavy == 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install pinned DotSlash runtime
        if: ${{ needs.preflight.outputs.run_heavy == 'true' }}
        run: tools/buck/install_dotslash.sh

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        if: ${{ needs.preflight.outputs.run_heavy == 'true' }}
        uses: ./.github/actions/setup-rust


      - name: Company conformance against disposable PostgreSQL
        if: ${{ needs.preflight.outputs.run_heavy == 'true' }}
        run: |
          tools/buck/test_needs_postgres.sh --num-threads=1 \
            //tools/buck:company-conformance-postgres

  generated-face-authority:
    # This status is the complete generated-face closure required by policy.
    # It becomes merge-enforced only after the live GitHub ruleset admits this
    # exact status; cheap `preflight` intentionally defers expensive faces.
    name: Generated faces — full required drift authority
    runs-on: macos-latest
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.run_heavy == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    timeout-minutes: 35

    steps:
      - name: Path-class skip proof
        if: ${{ needs.preflight.outputs.run_heavy != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'path-class skip proof: %s not required for class=%s\n' "${GITHUB_JOB}" "${{ needs.preflight.outputs.path_class }}"
      - name: Checkout
        if: ${{ needs.preflight.outputs.run_heavy == 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install pinned DotSlash runtime
        if: ${{ needs.preflight.outputs.run_heavy == 'true' }}
        run: tools/buck/install_dotslash.sh

      - name: Set up Node.js
        if: ${{ needs.preflight.outputs.run_heavy == 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Set up Java
        if: ${{ needs.preflight.outputs.run_heavy == 'true' }}
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        if: ${{ needs.preflight.outputs.run_heavy == 'true' }}
        uses: ./.github/actions/setup-rust

      - name: Install lock-pinned Reindeer Rust toolchain
        if: ${{ needs.preflight.outputs.run_heavy == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=third-party/rust/reindeer/upstream.lock
          source third-party/rust/reindeer/upstream.lock
          rustup toolchain install "$REINDEER_TOOLCHAIN" --profile minimal

      - name: Install workspace dependencies
        if: ${{ needs.preflight.outputs.run_heavy == 'true' }}
        run: npm ci

      - name: Full generated-face closure
        if: ${{ needs.preflight.outputs.run_heavy == 'true' }}
        run: tools/buck/preflight.sh --full-generated-faces

  backend:
    name: Backend — ${{ matrix.leg }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.run_heavy == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    # Three legs run in PARALLEL. Measured on merge_group run 32402124838 this
    # job was the 17m critical path of a 19m CI run, and three steps were 757s
    # of its ~1,070s of work: the dev-auth PostgreSQL suites (355s), clippy
    # (217s) and the console-app unit suite (185s). Nothing else exceeded 82s.
    # Splitting into separate JOBS was designed and refuted: it touches every
    # pinned contract and creates two false-green surfaces (a job not wired
    # into required-ci's needs runs and gates nothing; a `steps.topology`
    # condition carried into a job with no topology step skips forever, green).
    # A matrix keeps the job id and every step's place in the bypass-mutation
    # matrix. Membership in Required / CI was removed 2026-08-28: this job is
    # postsubmit (push/workflow_dispatch) so the merge wall stays under 5m.
    # Image-release still waits for the completed CI workflow on dev.
    #
    # Each leg pays its own ~55s setup (containers, cache restore, toolchain,
    # checkout). fail-fast is off so one red leg never hides the others'
    # results -- the same fail-slow rule the step layer already follows.
    strategy:
      fail-fast: false
      matrix:
        # Keep strategy.matrix.leg pinned (preflight). Native cargo rustc on both
        # ship arches via include; Buck legs stay amd64.
        leg: [cargo, buck-app, buck-dev-auth]
        os: [ubuntu-24.04]
        include:
          - { leg: cargo, os: ubuntu-24.04-arm }
    # Serial integration execution avoids cluster-global role mutation races.
    #
    # NOTE: the "full workspace" this number was originally sized for no longer
    # runs here. Migration 0196 admits only `console_buck_admin` (with
    # `console.sqlx_test_bootstrap` armed) for applying migrations, so the workspace
    # run was dropped rather than re-identified. The topology step below now
    # provisions that role, so restoring the sweep is a matter of pointing it at
    # $CONSOLE_BUCK_ADMIN_DATABASE_URL -- see H-8 in
    # docs/program/false-green-gate-holes.md. Deliberately not done here: it
    # will surface a genuine backlog and belongs in its own change.
    #
    # 90 rather than 45 because the harness performs 13 per-invocation Docker
    # bring-ups (2 Apalis + 11 guarded regressions), each with container start
    # and topology reconcile, and this branch carries considerably more code
    # than main.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: console_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d console_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/console_ci
      # Job-level so every step (including the gate binaries, which didn't
      # previously set it themselves) compiles query! macros against the
      # committed .sqlx cache instead of an unmigrated DB. Cheap insurance;
      # steps below still set it explicitly too, which is a harmless no-op.
      SQLX_OFFLINE: "true"
      # Backend CI compiles the full workspace, tests, and custom gates on the
      # standard GitHub runner. Keep artifacts lean so unrelated UI-only PRs do
      # not fail from runner disk exhaustion while preserving the same checks.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Path-class skip proof
        id: skip-proof
        if: ${{ needs.preflight.outputs.run_heavy != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'path-class skip proof: %s not required for class=%s\n' "${GITHUB_JOB}" "${{ needs.preflight.outputs.path_class }}"

      - name: Install pinned DotSlash runtime
        id: dotslash
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        run: ../tools/buck/install_dotslash.sh

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        id: rust
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        uses: ./.github/actions/setup-rust

      - name: Cache Rust dependencies + build artifacts
        id: rust-cache
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        # rust-cache keys on Cargo.lock + rustc + job, caches registry/git deps
        # and prunes stale crates from target/ (so the cache does not grow
        # unbounded on every Cargo.lock change the way a raw target/ cache does).
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend
          # One shared entry, not one per job. rust-cache keys on job name by
          # default, so these two maintained separate near-duplicate copies of the
          # same workspace and evicted each other out of the 10GB LRU budget.
          # Arch is part of the key so amd64 and arm64 do not overwrite each other.
          shared-key: backend-cargo-${{ matrix.os }}
          cache-all-crates: "true"
          # The ONLY writer. `backend` runs clippy --all-targets over the whole
          # workspace, a strict superset of every other cargo job, so its target dir
          # is the one worth sharing. Saving only from dev keeps PR branches from
          # publishing a cache shaped by their own diff.
          save-if: ${{ github.ref == 'refs/heads/dev' && matrix.leg == 'cargo' }}

      - name: rustfmt check
        id: fmt
        if: ${{ !cancelled() && matrix.leg == 'cargo' && needs.preflight.outputs.run_heavy == 'true' }}
        run: cargo fmt --all -- --check

      # This lints the DEFAULT feature set, which for `console-app` is the EMPTY
      # one -- backend/app/Cargo.toml declares no `default` key, so cargo's
      # implicit default is nothing. Every non-default feature in the workspace
      # was therefore unlinted, and a green clippy here was over-read as "the
      # workspace lints clean" when it meant "one feature set lints clean"
      # (#1093).
      # The extra sets stay INSIDE this step deliberately. The preflight
      # contract pins that source-only gates run immediately after clippy, and
      # that adjacency is an invariant rather than an artefact -- a separate
      # step would break it for cosmetics.
      #
      # The non-default sets below lint clean today, so they cannot regress
      # unnoticed. Both are scoped rather than workspace-wide: `dev-auth` is an
      # app-level feature (`dev-auth = ["console-platform-auth-rest/dev-auth"]`)
      # and the wasm bundle is one crate, so this costs ~40s warm rather than a
      # second full workspace pass.
      #
      # `--features test-postgres` is deliberately absent and is NOT clean: it
      # exits 101, on this branch and equally on the base before it, so it
      # predates this change. Declared rather than silently omitted -- an
      # unlinted feature set nobody wrote down is how the gap above happened.
      # Tracked in #1093.
      - name: clippy -D warnings
        id: clippy
        if: ${{ !cancelled() && matrix.leg == 'cargo' && needs.preflight.outputs.run_heavy == 'true' }}
        run: |
          set -euo pipefail
          SQLX_OFFLINE=true cargo clippy --all-targets -- -D warnings
          SQLX_OFFLINE=true cargo clippy -p console-app --all-targets --features dev-auth -- -D warnings
          SQLX_OFFLINE=true cargo clippy -p console-payroll-ui --target wasm32-unknown-unknown --no-default-features --features hydrate,islands --lib -- -D warnings
      # Wave C (DN-0006): first Required-CI gate family on Buck2. Invoked from
      # backend/ so the binary's cwd remains the Cargo workspace root it scans;
      # Buck2 walks up to the repo .buckconfig. Keep warm-cache overlays opt-in
      # (fail-closed) — do not attach --config-file infra/ci/buckconfig/warm-*.
      - name: Layer-boundary gate
        id: layer-boundary
        if: ${{ !cancelled() && matrix.leg == 'cargo' && needs.preflight.outputs.run_heavy == 'true' }}
        run: ../tools/buck2 run //backend/ci/gates/layer-boundary:console-gate-layer-boundary

      - name: Audit-coverage gate
        id: audit-coverage
        if: ${{ !cancelled() && matrix.leg == 'cargo' && needs.preflight.outputs.run_heavy == 'true' }}
        run: cargo run -p console-gate-audit-coverage

      - name: Migration-safety gate
        id: migration-safety
        if: ${{ !cancelled() && matrix.leg == 'cargo' && needs.preflight.outputs.run_heavy == 'true' }}
        run: cargo run -p console-gate-migration-safety

      - name: Tenant-isolation gate
        id: tenant-isolation
        if: ${{ !cancelled() && matrix.leg == 'cargo' && needs.preflight.outputs.run_heavy == 'true' }}
        run: cargo run -p console-gate-tenant-isolation

      - name: PII-no-logs gate
        id: pii-no-logs
        if: ${{ !cancelled() && matrix.leg == 'cargo' && needs.preflight.outputs.run_heavy == 'true' }}
        run: cargo run -p console-gate-pii-no-logs

      - name: RLS-arming gate
        id: rls-arming
        if: ${{ !cancelled() && matrix.leg == 'cargo' && needs.preflight.outputs.run_heavy == 'true' }}
        run: cargo run -p console-gate-rls-arming

      - name: Dev-auth-absence gate
        id: dev-auth-absence
        if: ${{ !cancelled() && matrix.leg == 'cargo' && needs.preflight.outputs.run_heavy == 'true' }}
        run: cargo run -p console-gate-dev-auth-absence

      - name: IaC tier-discipline gate
        id: iac-tier
        if: ${{ !cancelled() && matrix.leg == 'cargo' && needs.preflight.outputs.run_heavy == 'true' }}
        run: cargo run -p console-gate-iac-tier

      # An authorization branch must come from the RESOURCE. Deriving it from
      # `principal.branch_scope` (`All => BranchId::new()`,
      # `Branches(b) => b.iter().next()/.any()`) makes `authorize`'s
      # `branch_scope.allows(resource_branch)` check a tautology on BOTH arms, so
      # the branch dimension disappears silently. That pattern reached 18
      # production helpers, one of which documented it as correct; a doc comment
      # is what already failed. This gate also fails if it walked zero .rs files.
      #
      # DEFENCE IN DEPTH, NOT A CONTROL. It greps: a fabrication one function
      # away, a non-literal pick (`.first()`, `.nth(0)`, a `for` loop) and any
      # `BranchScope::` import alias all scan clean. The three blind spots are
      # named in the module doc and in docs/CI-GATES.md; the control that closes
      # them is a `ResourceBranch` newtype, queued separately.
      - name: Fabricated-branch gate
        id: fabricated-branch
        if: ${{ !cancelled() && matrix.leg == 'cargo' && needs.preflight.outputs.run_heavy == 'true' }}
        run: cargo run -p console-gate-fabricated-branch

      - name: Personal-data-classification gate
        id: personal-data-classification
        if: ${{ !cancelled() && matrix.leg == 'cargo' && needs.preflight.outputs.run_heavy == 'true' }}
        run: cargo run -p console-gate-personal-data-classification

      # The STATIC half of writer ownership: at most one production crate may
      # hold DML against each canonical-object table. Best-effort by
      # construction — the load-bearing half is the database capability census
      # in ops/postgres-reconcile-topology.sh, executed by
      # //backend/ci/gates/writer-ownership:console-gate-writer-ownership-itest-census_executes_against_postgres
      # through the disposable-PostgreSQL cargo harness. Two residual shapes are
      # pinned by `known_residual_` tests; bead console-tai.1 carries the total fix.
      - name: Writer-ownership gate
        id: writer-ownership
        if: ${{ !cancelled() && matrix.leg == 'cargo' && needs.preflight.outputs.run_heavy == 'true' }}
        run: cargo run -p console-gate-writer-ownership

      # The ten remaining `cargo run -p console-gate-*` steps above (plus the
      # Buck2-primary Layer-boundary gate) only prove the gates exit 0 against
      # THIS tree. A gate whose scan root no longer resolves -- e.g. after the
      # 2026-07-28 deletion moved or emptied a directory it walks -- also exits
      # 0, so "green" cannot be distinguished from "scanned nothing". These are
      # the only artifacts that plant a violation in a throwaway tree and assert
      # the gate rejects it; without this step they were compiled by clippy
      # --all-targets and never executed.
      #
      # `env -u DATABASE_URL` matches the other hermetic Buck2 steps: none of
      # these eight targets touches a database (audit-coverage carries a stale
      # `needs-postgres` label only because gen_first_party.py keys on the
      # literal "sqlx" appearing in its fixture strings -- the crate has zero
      # dependencies). Placed before the DB-heavy steps so a de-fanged gate
      # fails the job in minutes rather than at the end.
      #
      # console-gate-writer-ownership is DELIBERATELY ABSENT from this list, and
      # adding it here fails the job. MEASURED 2026-08-09: under Buck2 only a
      # target's own mapped_srcs are materialized, so 3 of the 41 tests in its
      # gate_detects_violation die on a path that is not there --
      # `measured_tip_has_exactly_the_ratcheted_dual_writers` walks the whole
      # backend crate tree, and two more read ops/postgres-reconcile-topology.sh
      # ("No such file or directory (os error 2)"). Unlike its siblings, that
      # suite asserts about THIS repository and not only about throwaway trees,
      # so it runs from a real checkout under `domain-unit` instead.
      # Its database half runs in the PostgreSQL reachability facets via
      # tools/ci/postgres-cargo-map.json.
      - name: Buck2 CI-gate mutation suites — every gate proven to still reject
        id: gate-mutation-suites
        if: ${{ !cancelled() && matrix.leg == 'cargo' && needs.preflight.outputs.run_heavy == 'true' }}
        working-directory: .
        run: |
          env -u DATABASE_URL tools/buck2 test \
            //backend/ci/gates/audit-coverage:console-gate-audit-coverage-itest-gate_detects_violation \
            //backend/ci/gates/fabricated-branch:console-gate-fabricated-branch-itest-gate_detects_violation \
            //backend/ci/gates/fabricated-branch:console-gate-fabricated-branch-unit \
            //backend/ci/gates/layer-boundary:console-gate-layer-boundary-itest-gate_detects_violation \
            //backend/ci/gates/migration-safety:console-gate-migration-safety-itest-gate_detects_violation \
            //backend/ci/gates/personal-data-classification:console-gate-personal-data-classification-itest-gate_detects_violation \
            //backend/ci/gates/pii-no-logs:console-gate-pii-no-logs-itest-gate_detects_violation \
            //backend/ci/gates/vendor-lockin:console-gate-vendor-lockin-itest-gate_detects_violation

      # Migration 0165 fails closed unless the portable seven-role topology
      # already exists. Reconcile it before any database test applies the
      # migration, using the distinct service administrator only for this
      # cluster-scoped bootstrap.
      - name: PR 473 migration operational contract tests
        id: pr473-contract-tests
        if: ${{ !cancelled() && matrix.leg == 'cargo' && needs.preflight.outputs.run_heavy == 'true' }}
        working-directory: .
        run: python3 scripts/check-pr473-migration-operational.test.py -v

      - name: Reconcile portable PostgreSQL role topology
        id: topology
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        run: |
          APP_PASSWORD="$(openssl rand -hex 32)"
          RT_PASSWORD="$(openssl rand -hex 32)"
          LEAVE_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          ONTOLOGY_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          PLATFORM_FORCE_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/ops/postgres-reconcile-topology.sh:/usr/local/bin/postgres-reconcile-topology:ro" \
            -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_DB=console_ci \
            -e POSTGRES_ADMIN_USER=postgres -e POSTGRES_ADMIN_PASSWORD=postgres \
            -e CONSOLE_APP_POSTGRES_PASSWORD="$APP_PASSWORD" \
            -e CONSOLE_RT_POSTGRES_PASSWORD="$RT_PASSWORD" \
            -e CONSOLE_LEAVE_COMMAND_POSTGRES_PASSWORD="$LEAVE_COMMAND_PASSWORD" \
            -e CONSOLE_ONTOLOGY_COMMAND_POSTGRES_PASSWORD="$ONTOLOGY_COMMAND_PASSWORD" \
            -e CONSOLE_PLATFORM_FORCE_COMMAND_POSTGRES_PASSWORD="$PLATFORM_FORCE_COMMAND_PASSWORD" \
            --entrypoint bash postgres:18.4@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20 \
            /usr/local/bin/postgres-reconcile-topology

          # The Apalis adapter contract intentionally mutates only its own
          # dedicated database while proving direct console_app/console_rt logins. The
          # job-level DATABASE_URL stays on the cluster administrator for the
          # boot smoke; it can no longer serve migration-applying tests, which
          # migration 0196 restricts to the console_buck_admin harness identity.
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            --entrypoint psql \
            postgres:18.4@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20 \
            -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS console_apalis_contract WITH (FORCE)" \
            -c "CREATE DATABASE console_apalis_contract OWNER console_app"

          # Migration 0196 restricts migration application to a superuser named
          # exactly `console_buck_admin` with `console.sqlx_test_bootstrap` armed (and a
          # test database it owns). The `postgres` service account therefore
          # cannot apply a single migration, which silently breaks every direct
          # `cargo test` that relies on `#[sqlx::test]`. Provision that identity
          # here so those suites can run; the password crosses through a
          # mode-0600 file, never argv.
          BUCK_ADMIN_PASSWORD="$(openssl rand -hex 32)"
          umask 077
          printf "CREATE ROLE console_buck_admin SUPERUSER LOGIN PASSWORD '%s';\n" \
            "$BUCK_ADMIN_PASSWORD" > "$RUNNER_TEMP/buck-admin.sql"
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$RUNNER_TEMP/buck-admin.sql:/buck-admin.sql:ro" \
            --entrypoint psql \
            postgres:18.4@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20 \
            -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f /buck-admin.sql
          rm -f "$RUNNER_TEMP/buck-admin.sql"

          echo "::add-mask::$APP_PASSWORD"
          echo "::add-mask::$RT_PASSWORD"
          echo "::add-mask::$BUCK_ADMIN_PASSWORD"
          {
            echo "CONSOLE_BUCK_ADMIN_DATABASE_URL=postgres://console_buck_admin:${BUCK_ADMIN_PASSWORD}@localhost:5432/console_ci?options%5Bconsole.sqlx_test_bootstrap%5D=buck-sqlx-superuser-v1"
            echo "CONSOLE_APALIS_OWNER_DATABASE_URL=postgres://console_app:${APP_PASSWORD}@localhost:5432/console_apalis_contract"
            echo "CONSOLE_APALIS_RUNTIME_DATABASE_URL=postgres://console_rt:${RT_PASSWORD}@localhost:5432/console_apalis_contract"
            echo "CONSOLE_APALIS_ADMIN_DATABASE_URL=postgres://postgres:postgres@localhost:5432/console_apalis_contract"
          } >> "$GITHUB_ENV"

      - name: Boot smoke — migrate + serve + /readyz
        id: boot-smoke
        if: ${{ !cancelled() && matrix.leg == 'cargo' && steps.topology.outcome == 'success' && needs.preflight.outputs.run_heavy == 'true' }}
        run: |
          set -e
          openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt -out /tmp/smoke-priv.pem
          openssl ec -in /tmp/smoke-priv.pem -pubout -out /tmp/smoke-pub.pem

          APP_PASSWORD="$(openssl rand -hex 32)"
          RT_PASSWORD="$(openssl rand -hex 32)"
          LEAVE_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          ONTOLOGY_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          PLATFORM_FORCE_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/ops/postgres-reconcile-topology.sh:/usr/local/bin/postgres-reconcile-topology:ro" \
            -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_DB=console_ci \
            -e POSTGRES_ADMIN_USER=postgres -e POSTGRES_ADMIN_PASSWORD=postgres \
            -e CONSOLE_APP_POSTGRES_PASSWORD="$APP_PASSWORD" \
            -e CONSOLE_RT_POSTGRES_PASSWORD="$RT_PASSWORD" \
            -e CONSOLE_LEAVE_COMMAND_POSTGRES_PASSWORD="$LEAVE_COMMAND_PASSWORD" \
            -e CONSOLE_ONTOLOGY_COMMAND_POSTGRES_PASSWORD="$ONTOLOGY_COMMAND_PASSWORD" \
            -e CONSOLE_PLATFORM_FORCE_COMMAND_POSTGRES_PASSWORD="$PLATFORM_FORCE_COMMAND_PASSWORD" \
            --entrypoint bash postgres:18.4 /usr/local/bin/postgres-reconcile-topology

          OWNER_DATABASE_URL="postgres://console_app:${APP_PASSWORD}@localhost:5432/console_ci"
          RUNTIME_DATABASE_URL="postgres://console_rt:${RT_PASSWORD}@localhost:5432/console_ci"
          LEAVE_COMMAND_DATABASE_URL="postgres://console_leave_cmd:${LEAVE_COMMAND_PASSWORD}@localhost:5432/console_ci"
          ONTOLOGY_COMMAND_DATABASE_URL="postgres://console_ontology_cmd:${ONTOLOGY_COMMAND_PASSWORD}@localhost:5432/console_ci"
          PLATFORM_FORCE_COMMAND_DATABASE_URL="postgres://console_platform_force_cmd:${PLATFORM_FORCE_COMMAND_PASSWORD}@localhost:5432/console_ci"
          export DATABASE_URL="$OWNER_DATABASE_URL"

          CONSOLE_APP_ROLE=migrate SQLX_OFFLINE=true cargo run -q -p console-app
          SQLX_OFFLINE=true cargo test --locked \
            -p console-gate-tenant-isolation \
            --test owner_only_acl_postgres18 -- \
            --include-ignored --test-threads=1

          CONSOLE_APP_ROLE=api \
          DATABASE_URL="$RUNTIME_DATABASE_URL" \
          LEAVE_COMMAND_DATABASE_URL="$LEAVE_COMMAND_DATABASE_URL" \
          ONTOLOGY_COMMAND_DATABASE_URL="$ONTOLOGY_COMMAND_DATABASE_URL" \
          PLATFORM_FORCE_COMMAND_DATABASE_URL="$PLATFORM_FORCE_COMMAND_DATABASE_URL" \
          CONSOLE_HTTP_ADDR=127.0.0.1:8092 \
          CONSOLE_JWT_ISSUER=ci-boot-smoke \
          CONSOLE_JWT_AUDIENCE=ci-boot-smoke \
          CONSOLE_JWT_PRIVATE_KEY_PEM="$(cat /tmp/smoke-priv.pem)" \
          CONSOLE_JWT_PUBLIC_KEY_PEM="$(cat /tmp/smoke-pub.pem)" \
          CONSOLE_WEBAUTHN_RP_ID=localhost \
          CONSOLE_WEBAUTHN_RP_ORIGIN=http://localhost \
          CONSOLE_COOKIE_SECURE=false \
          SQLX_OFFLINE=true \
          cargo run -q -p console-app &
          BOOT_PID=$!

          ready=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8092/readyz; then
              ready=1
              break
            fi
            sleep 2
          done

          kill "$BOOT_PID" 2>/dev/null || true
          wait "$BOOT_PID" 2>/dev/null || true

          if [ "$ready" != "1" ]; then
            echo "::error::console-app never became ready in boot smoke"
            exit 1
          fi

      - name: Buck2 dev-auth feature PostgreSQL suites
        id: dev-auth-suites
        if: ${{ !cancelled() && matrix.leg == 'buck-dev-auth' && steps.topology.outcome == 'success' && needs.preflight.outputs.run_heavy == 'true' }}
        working-directory: .
        # `dev-auth` is NOT in default features (proven above). These exact
        # feature-sensitive auth-rest and provisioning binaries run through
        # generator-owned Buck targets and the disposable role-topology harness;
        # direct Cargo would bypass that contract.
        # That harness uses the migration-0196-authorized `console_buck_admin`
        # identity with `console.sqlx_test_bootstrap` armed, so the suites reach
        # their assertions instead of failing during migration application.
        run: |
          tools/buck/test_needs_postgres.sh --num-threads=1 \
            //tools/buck:auth-rest-dev-auth-inline-postgres \
            //tools/buck:auth-rest-dev-auth-session-postgres \
            //tools/buck:auth-rest-dev-auth-group-admin-postgres \
            //tools/buck:provisioning-dev-principal-upsert-race-postgres

      # The residual lowering that decides which instance rows a caller may see
      # lives in this crate, and its 44 unit tests — including
      # `unconditional_forbid_collapses_whole_filter_to_false`,
      # `untranslatable_term_collapses_whole_filter_never_drops` and
      # `unsafe_attributes_column_denies_all` — executed NOWHERE in CI. The
      # target resolved and built; no workflow referenced it. That is the
      # false-green class this repo has already shipped: a correct test that
      # never runs. It also carries the dotted-stable-key refusal matrix, the
      # only evidence that widening `is_stable_key` for dots did not widen the
      # Cedar injection boundary on any other axis.
      - name: Buck2 platform-authz unit suite
        id: authz-unit
        if: ${{ !cancelled() && matrix.leg == 'buck-app' && needs.preflight.outputs.run_heavy == 'true' }}
        working-directory: .
        run: env -u DATABASE_URL tools/buck2 test //backend/crates/platform/authz:console-platform-authz-unit

      - name: Buck2 console-app unit suite
        id: app-unit
        if: ${{ !cancelled() && matrix.leg == 'buck-app' && needs.preflight.outputs.run_heavy == 'true' }}
        working-directory: .
        run: env -u DATABASE_URL tools/buck2 test //backend/app:console-app-unit

      # openapi.yaml is the single source of truth for the REST surface and is
      # include_str!-ed into the binary. This suite is the only thing that
      # inventories every mounted route against it. It existed but was never
      # invoked by CI, so drift between the router and the spec could land
      # unnoticed; `check:platform-contract-drift` does not cover this (it only
      # regexes /api/platform/ paths). The byte-compare of the served document
      # against the file was deleted: include_str! made it tautological.
      - name: Buck2 console-app OpenAPI drift suite
        id: openapi-drift
        if: ${{ !cancelled() && matrix.leg == 'buck-app' && needs.preflight.outputs.run_heavy == 'true' }}
        working-directory: .
        run: env -u DATABASE_URL tools/buck2 test //backend/app:console-app-itest-openapi_drift

      - name: Buck2 console-app inline PostgreSQL suites
        id: app-inline-pg
        if: ${{ !cancelled() && matrix.leg == 'buck-app' && steps.topology.outcome == 'success' && needs.preflight.outputs.run_heavy == 'true' }}
        working-directory: .
        run: |
          tools/buck/test_needs_postgres.sh --num-threads=1 \
            //tools/buck:app-inline-postgres \
            //tools/buck:app-dev-auth-persona-guard-postgres

      - name: Collect failures
        if: ${{ !cancelled() }}
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        working-directory: .
        run: node scripts/ci-collect-failures.mjs

  migration-expand-contract:
  # Split out of `backend` 2026-08-18. Measured on merge-group run 32206464663,
  # this one step was 445s of a 1176s job -- the largest step anywhere in CI and,
  # with `backend` on the critical path, the binding constraint on wall clock.
  # Isolating it takes `backend` to ~731s, below the PostgreSQL shards, which
  # become the critical path instead. Splitting `backend` further is wasted until
  # the shards get faster, so this is deliberately one new job and not three.
  #
  # It carries the same services/env/setup as `backend` and re-runs the topology
  # reconcile (7s) because the gate asserts on `steps.topology.outcome`.
    name: Migration expand/contract rehearsal — 0165 ontology key-revision, 0166 leave
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.run_heavy == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    # Serial integration execution avoids cluster-global role mutation races.
    #
    # NOTE: the "full workspace" this number was originally sized for no longer
    # runs here. Migration 0196 admits only `console_buck_admin` (with
    # `console.sqlx_test_bootstrap` armed) for applying migrations, so the workspace
    # run was dropped rather than re-identified. The topology step below now
    # provisions that role, so restoring the sweep is a matter of pointing it at
    # $CONSOLE_BUCK_ADMIN_DATABASE_URL -- see H-8 in
    # docs/program/false-green-gate-holes.md. Deliberately not done here: it
    # will surface a genuine backlog and belongs in its own change.
    #
    # 90 rather than 45 because the harness performs 13 per-invocation Docker
    # bring-ups (2 Apalis + 11 guarded regressions), each with container start
    # and topology reconcile, and this branch carries considerably more code
    # than main.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: console_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d console_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/console_ci
      # Job-level so every step (including the gate binaries, which didn't
      # previously set it themselves) compiles query! macros against the
      # committed .sqlx cache instead of an unmigrated DB. Cheap insurance;
      # steps below still set it explicitly too, which is a harmless no-op.
      SQLX_OFFLINE: "true"
      # Backend CI compiles the full workspace, tests, and custom gates on the
      # standard GitHub runner. Keep artifacts lean so unrelated UI-only PRs do
      # not fail from runner disk exhaustion while preserving the same checks.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Path-class skip proof
        id: skip-proof
        if: ${{ needs.preflight.outputs.run_heavy != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'path-class skip proof: %s not required for class=%s\n' "${GITHUB_JOB}" "${{ needs.preflight.outputs.path_class }}"

      - name: Install pinned DotSlash runtime
        id: dotslash
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        run: ../tools/buck/install_dotslash.sh

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        id: rust
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        uses: ./.github/actions/setup-rust

      - name: Cache Rust dependencies + build artifacts
        id: rust-cache
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        # rust-cache keys on Cargo.lock + rustc + job, caches registry/git deps
        # and prunes stale crates from target/ (so the cache does not grow
        # unbounded on every Cargo.lock change the way a raw target/ cache does).
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend
          # One shared entry, not one per job. rust-cache keys on job name by
          # default, so these two maintained separate near-duplicate copies of the
          # same workspace and evicted each other out of the 10GB LRU budget.
          shared-key: backend-cargo
          cache-all-crates: "true"
          # Restore-only. This comment used to say "The ONLY writer": it was copied
          # from `backend` when this job was split out, and was false in place --
          # it made this the SECOND writer of the shared entry, racing `backend`
          # for the same key on every main push, and it was absent from the
          # one-writer check in check-ci-preflight.mjs so nothing noticed. The
          # writer is `backend`'s cargo leg, whose clippy --all-targets is a strict
          # superset of what runs here.
          save-if: false

      - name: Reconcile portable PostgreSQL role topology
        id: topology
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        run: |
          APP_PASSWORD="$(openssl rand -hex 32)"
          RT_PASSWORD="$(openssl rand -hex 32)"
          LEAVE_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          ONTOLOGY_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          PLATFORM_FORCE_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/ops/postgres-reconcile-topology.sh:/usr/local/bin/postgres-reconcile-topology:ro" \
            -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_DB=console_ci \
            -e POSTGRES_ADMIN_USER=postgres -e POSTGRES_ADMIN_PASSWORD=postgres \
            -e CONSOLE_APP_POSTGRES_PASSWORD="$APP_PASSWORD" \
            -e CONSOLE_RT_POSTGRES_PASSWORD="$RT_PASSWORD" \
            -e CONSOLE_LEAVE_COMMAND_POSTGRES_PASSWORD="$LEAVE_COMMAND_PASSWORD" \
            -e CONSOLE_ONTOLOGY_COMMAND_POSTGRES_PASSWORD="$ONTOLOGY_COMMAND_PASSWORD" \
            -e CONSOLE_PLATFORM_FORCE_COMMAND_POSTGRES_PASSWORD="$PLATFORM_FORCE_COMMAND_PASSWORD" \
            --entrypoint bash postgres:18.4@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20 \
            /usr/local/bin/postgres-reconcile-topology

          # The Apalis adapter contract intentionally mutates only its own
          # dedicated database while proving direct console_app/console_rt logins. The
          # job-level DATABASE_URL stays on the cluster administrator for the
          # boot smoke; it can no longer serve migration-applying tests, which
          # migration 0196 restricts to the console_buck_admin harness identity.
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            --entrypoint psql \
            postgres:18.4@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20 \
            -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS console_apalis_contract WITH (FORCE)" \
            -c "CREATE DATABASE console_apalis_contract OWNER console_app"

          # Migration 0196 restricts migration application to a superuser named
          # exactly `console_buck_admin` with `console.sqlx_test_bootstrap` armed (and a
          # test database it owns). The `postgres` service account therefore
          # cannot apply a single migration, which silently breaks every direct
          # `cargo test` that relies on `#[sqlx::test]`. Provision that identity
          # here so those suites can run; the password crosses through a
          # mode-0600 file, never argv.
          BUCK_ADMIN_PASSWORD="$(openssl rand -hex 32)"
          umask 077
          printf "CREATE ROLE console_buck_admin SUPERUSER LOGIN PASSWORD '%s';\n" \
            "$BUCK_ADMIN_PASSWORD" > "$RUNNER_TEMP/buck-admin.sql"
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$RUNNER_TEMP/buck-admin.sql:/buck-admin.sql:ro" \
            --entrypoint psql \
            postgres:18.4@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20 \
            -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f /buck-admin.sql
          rm -f "$RUNNER_TEMP/buck-admin.sql"

          echo "::add-mask::$APP_PASSWORD"
          echo "::add-mask::$RT_PASSWORD"
          echo "::add-mask::$BUCK_ADMIN_PASSWORD"
          {
            echo "CONSOLE_BUCK_ADMIN_DATABASE_URL=postgres://console_buck_admin:${BUCK_ADMIN_PASSWORD}@localhost:5432/console_ci?options%5Bconsole.sqlx_test_bootstrap%5D=buck-sqlx-superuser-v1"
            echo "CONSOLE_APALIS_OWNER_DATABASE_URL=postgres://console_app:${APP_PASSWORD}@localhost:5432/console_apalis_contract"
            echo "CONSOLE_APALIS_RUNTIME_DATABASE_URL=postgres://console_rt:${RT_PASSWORD}@localhost:5432/console_apalis_contract"
            echo "CONSOLE_APALIS_ADMIN_DATABASE_URL=postgres://postgres:postgres@localhost:5432/console_apalis_contract"
          } >> "$GITHUB_ENV"

      - name: Expand/contract migration rehearsal (0165, 0166)
        id: pr473-gate
        if: ${{ !cancelled() && steps.topology.outcome == 'success' && needs.preflight.outputs.run_heavy == 'true' }}
        working-directory: .
        # SQLX_OFFLINE=true so the query! macros compile against the committed
        # .sqlx cache (the documented contract — see crates/platform/db/src/lib.rs)
        # rather than the unmigrated CI service DB. The #[sqlx::test] runtime
        # tests still use DATABASE_URL to create their own per-test databases.
        # Without this, a Cargo.lock change busts the build cache and the macros
        # re-check online against a schema-less DB ("audit_events does not exist").
        # The wrapper isolates the 11 migration regressions for exact one-test
        # runtime-result validation. It does NOT preserve a full workspace run --
        # migration 0196 restricts migration application to the console_buck_admin
        # harness identity, so the service DB cannot host one (H-8 in
        # docs/program/false-green-gate-holes.md). Every test binary remains
        # serial because topology upgrade tests mutate cluster-global roles.
        run: npm run check:pr473-migration-operational

      # Boot smoke: the real console-app binary, migrate then serve mode, against
      # this job's fresh service DB — catches route-panic-at-boot regressions
      # (e.g. a bad router/state wiring) that unit/integration tests never
      # exercise because they never call `serve()`. Mirrors the minimal env
      # image-release.yml's release-probe job uses to boot the shipped image;
      # a throwaway keypair is fine, this only proves the app comes up.
      - name: Collect failures
        if: ${{ !cancelled() }}
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        working-directory: .
        run: node scripts/ci-collect-failures.mjs


  repo-gates:
    name: Repo gates — ADR / foundation / domain maturity
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: ADR governance tests
        if: ${{ !cancelled() }}
        run: npm run test:adrs

      - name: ADR governance gate
        if: ${{ !cancelled() }}
        run: npm run check:adrs
      - name: Documentation link tests
        if: ${{ !cancelled() }}
        run: node --test scripts/check-doc-links.test.mjs
      - name: Documentation manifest gate
        if: ${{ !cancelled() }}
        run: npm run check:doc-manifest
      - name: Documentation local-link gate
        if: ${{ !cancelled() }}
        run: npm run check:doc-links
      - name: Doc citations — every code citation must resolve
        if: ${{ !cancelled() }}
        run: npm run check:doc-citations

      - name: Foundation gate contract
        if: ${{ !cancelled() }}
        run: npm run check:foundation-gates

      - name: Canonical npm lockfile
        if: ${{ !cancelled() }}
        run: npm run check:package-lock

      - name: Shared text gate unit tests
        if: ${{ !cancelled() }}
        run: npm run test:text-gate
      - name: Gate-input provenance instrument
        if: ${{ !cancelled() }}
        run: npm run check:gate-input-provenance
      - name: Gate-input provenance unit tests
        if: ${{ !cancelled() }}
        run: npm run test:gate-input-provenance
      - name: G004 identity group org people policy foundation gate
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        run: npm run check:g004-identity-foundation

      - name: G005 workflow approval Work Hub lifecycle gate
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        run: npm run check:g005-workflow-lifecycle

      - name: Workflow runtime spine gate
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        run: npm run check:workflow-runtime-spine

      - name: Workflow runtime M2 strangler dark-landing gate
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        run: npm run check:workflow-runtime-m2-strangler

      - name: Workflow runtime M2 Cedar-guard observe-and-record gate
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        run: npm run check:workflow-runtime-m2-cedar-guards

      - name: Workflow runtime M2 flag-ON runtime gate
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        run: npm run check:workflow-runtime-m2-runtime

      - name: Workflow runtime M2 outbox-drainer transactional-idempotency gate
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        run: npm run check:workflow-runtime-m2-drainer

      - name: G006 asset equipment dispatch lifecycle gate
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        run: npm run check:g006-asset-dispatch-lifecycle

      - name: G007 collaboration mail calendar poll mobile lifecycle gate
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        run: npm run check:g007-collaboration-mobile-lifecycle

      - name: G008 import HR payroll readiness gate
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        run: npm run check:g008-payroll-readiness

      - name: People HR lifecycle maturity gate
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        run: npm run check:people-hr-maturity

      - name: Payroll release-gate contract
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        run: npm run check:payroll-release-gate

      - name: Undeclared imports — every bare specifier must be declared
        if: ${{ !cancelled() && needs.preflight.outputs.run_heavy == 'true' }}
        run: npm run check:undeclared-imports

