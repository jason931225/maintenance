      - name: Run disposable PostgreSQL integration targets
        if: ${{ needs.preflight.outputs.run_live_postgres == 'true' }}
        run: |
          tools/ci/cargo_needs_postgres.sh --workflow-only --shard-id app --num-threads=1 --runner nextest

