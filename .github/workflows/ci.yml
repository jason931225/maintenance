name: CI

on:
  # A merge group is the queue's candidate merge commit. Without this trigger
  # every required context stays Pending for every queue entry and merges
  # deadlock -- the queue waits forever for a check that never starts.
  merge_group:
  push:
    branches:
      - dev
    tags:
      - "v*"
  # Required checks must be created for every relevant push and pull request. A
  # `paths` filter leaves required contexts Pending forever when candidate-controlled
  # action, trust, security, or tool configuration changes outside an allowlist.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs only for PRs. On dev, every push must run CI to
  # completion. Its completion wakes image-release's read-only classifier; only
  # an exact immutable source release with matching CI + Security may allocate
  # native image builders. A rapid merge train must not cancel dev CI.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: CI preflight — foundation and lockfile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      path_class: ${{ steps.path_class.outputs.path_class }}
      docs_only: ${{ steps.path_class.outputs.docs_only }}
      run_heavy: ${{ steps.path_class.outputs.run_heavy }}
      run_live_postgres: ${{ steps.path_class.outputs.run_live_postgres }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        id: setup-node
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Install workspace dependencies
        id: npm-ci
        if: ${{ !cancelled() && steps.setup-node.outcome == 'success' }}
        run: npm ci

      - name: Classify path class
        id: path_class
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        shell: bash
        env:
          PATH_CLASS_EVENT_NAME: ${{ github.event_name }}
          PATH_CLASS_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PATH_CLASS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PATH_CLASS_PUSH_BEFORE_SHA: ${{ github.event.before }}
          PATH_CLASS_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PATH_CLASS_MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PATH_CLASS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/check-ci-preflight.mjs --emit-path-class

      - name: Release metadata semantic regression
        id: release-metadata-regression
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: node --test scripts/check-release-metadata.test.mjs

      - name: Release metadata semantic gate
        id: release-metadata
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' && steps.path_class.outputs.path_class == 'release-metadata-only' }}
        shell: bash
        env:
          RELEASE_METADATA_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          RELEASE_METADATA_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          node scripts/check-release-metadata.mjs \
            --base "$RELEASE_METADATA_BASE_SHA" \
            --head "$RELEASE_METADATA_HEAD_SHA"

      - name: Release metadata documentation link tests
        id: release-doc-link-tests
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' && steps.path_class.outputs.path_class == 'release-metadata-only' }}
        run: node --test scripts/check-doc-links.test.mjs

      - name: Release metadata documentation manifest gate
        id: release-doc-manifest
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' && steps.path_class.outputs.path_class == 'release-metadata-only' }}
        run: npm run check:doc-manifest

      - name: Release metadata documentation local-link gate
        id: release-doc-links
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' && steps.path_class.outputs.path_class == 'release-metadata-only' }}
        run: npm run check:doc-links

      # DotSlash + Rust follow classification so thin path classes can skip them without
      # reading an empty steps.path_class output (GHA evaluates if before later steps).
      - name: Install pinned DotSlash runtime
        id: dotslash
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.path_class.outputs.run_heavy == 'true' }}
        run: tools/buck/install_dotslash.sh

      - name: Install Rust toolchain for Cargo.lock consistency
        id: rust-toolchain
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.path_class.outputs.run_heavy == 'true' }}
        uses: ./.github/actions/setup-rust

      - name: Cheap Buck2 generated-face admission
        id: buck-admission
        if: ${{ !cancelled() && steps.dotslash.outcome == 'success' && steps.path_class.outputs.run_heavy == 'true' }}
        run: tools/buck/preflight.sh

      - name: Foundation gate contract
        id: foundation-gates
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm run check:foundation-gates

      - name: Reasoning lens manifest regression
        id: reasoning-lens-manifest-regression
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: node --test scripts/check-reasoning-lens-manifest.test.mjs

      - name: Reasoning lens manifest drift
        id: reasoning-lens-manifest
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: node scripts/check-reasoning-lens-manifest.mjs

      - name: CI preflight contract tests
        id: ci-preflight-tests
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: node --test scripts/check-ci-preflight.test.mjs

      - name: Buck impact planner regression
        id: buck-impact-planner
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: python3 -m unittest -v tools.buck.impact.test_plan

      - name: Console route inventory regression
        id: route-inventory
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: node --test scripts/console/route-inventory.test.mjs

      - name: Console authority-train regression
        id: authority-train
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: node --test scripts/console/verify-console-authority-train.test.mjs

      - name: Console lane-receipt validator regression
        id: lane-receipt
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm run test:lane-receipt

      - name: Console PR authority bootstrap regression
        id: pr-authority-bootstrap
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: node --test scripts/console/release-please-pr-envelope.test.mjs scripts/console/release-please-pr-fallback.test.mjs scripts/console/verify-console-pr-authority-bootstrap.test.mjs scripts/console/release-please-bot-candidate.test.mjs scripts/console/release-authority-proof.test.mjs scripts/console/converge-release-please-doc-custody.test.mjs scripts/console/verify-console-merge-group-authority.test.mjs

      - name: Executed-tests baseline set regression
        id: executed-tests-baseline
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm run test:executed-tests-baseline

      - name: Local CI mirror contract
        id: ci-mirror
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: node --test scripts/verify.test.mjs

      - name: Console truth-ledger validator exact-M regression
        id: truth-ledger-validator
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: node --test scripts/console/validate-console-truth-ledger.test.mjs

      - name: Console fanout planner exact-M regression
        id: fanout-planner
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: node --test scripts/console/plan-fanout.test.mjs

      - name: Buck PostgreSQL environment wrapper regression
        id: buck-pg-env
        if: ${{ !cancelled() && steps.dotslash.outcome == 'success' && steps.path_class.outputs.run_heavy == 'true' }}
        run: tools/buck/run_test_with_postgres_env.test.sh

      - name: Buck disposable PostgreSQL harness regression
        id: buck-pg-harness
        if: ${{ !cancelled() && steps.dotslash.outcome == 'success' && steps.path_class.outputs.run_heavy == 'true' }}
        run: tools/buck/test_needs_postgres.test.sh

      - name: CI preflight contract
        id: ci-preflight-contract
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm run check:ci-preflight

      - name: Canonical npm lockfile
        id: package-lock
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm run check:package-lock

      - name: Cargo.lock consistency
        id: cargo-lock
        if: ${{ !cancelled() && steps.rust-toolchain.outcome == 'success' && steps.path_class.outputs.run_heavy == 'true' }}
        run: cargo metadata --manifest-path backend/Cargo.toml --locked --format-version=1 >/dev/null

      # Moved here from repo-gates, which has npm and no Rust: the ratchet now
      # resolves `cargo metadata` as well as the BUCK graph, so it has to run
      # where cargo does. The step above it is `cargo metadata` on the same
      # manifest, and preflight is the only job carrying both toolchains.
      - name: Executed-tests ratchet — a test binary must have a path from a workflow step
        id: executed-tests-ratchet
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' && steps.path_class.outputs.run_heavy == 'true' }}
        run: npm run check:executed-tests
      - name: JavaScript test reachability ratchet
        id: js-reachability-ratchet
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm run check:js-test-reachability
      - name: JavaScript test reachability unit tests
        id: js-reachability-tests
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm run test:js-test-reachability

      - name: Lane fan-out harness preflight
        id: lane-fanout
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: node scripts/console/workflows/lane-fanout.test.mjs
      - name: Workflow test-runner credential literals
        id: test-credentials
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: npm run check:test-credentials

      - name: Collect failures
        if: ${{ !cancelled() }}
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci-collect-failures.mjs

  domain-unit:
    name: Domain crates — unit tests
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.run_heavy == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    timeout-minutes: 20
    env:
      # MUST match the cache writer (`backend`'s cargo leg). rust-cache folds every
      # CARGO_* variable into its environment hash; this job set neither of these,
      # so its key was ...-b587c171- while the writer published ...-f3304cdf-
      # (identical lockfile half) and it logged "No cache found." on EVERY run --
      # all 14 recent main runs, 577-749s each. Measured on merge_group run
      # 32434156418: this step is 684.8s of rustc (1434 `Compiling`, 0 `Fresh`)
      # and ~29s of actual test execution. It was never a slow test suite; it
      # was a cold build on every run, masquerading as one.
      #
      # The same two variables fixed the same miss on the PostgreSQL shards on
      # 2026-08-18 (see postgres-reachability-app). The preflight contract used
      # to FORBID any env on this job; that ban is what kept this miss in place.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - name: Path-class skip proof
        if: ${{ needs.preflight.outputs.run_heavy != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'path-class skip proof: %s not required for class=%s\n' "${GITHUB_JOB}" "${{ needs.preflight.outputs.path_class }}"
      - name: Checkout
        if: ${{ needs.preflight.outputs.run_heavy == 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        if: ${{ needs.preflight.outputs.run_heavy == 'true' }}
        uses: ./.github/actions/setup-rust

      - name: Cache Rust dependencies + build artifacts
        if: ${{ needs.preflight.outputs.run_heavy == 'true' }}
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend
          # One shared entry, not one per job. rust-cache keys on job name by
          # default, so these two maintained separate near-duplicate copies of the
          # same workspace and evicted each other out of the 10GB LRU budget.
          shared-key: backend-cargo
          cache-all-crates: "true"
          # RESTORE-ONLY. This job compiles three crates; `backend` compiles the whole
          # workspace. Under a shared key without this, whichever finishes first wins —
          # so a three-crate target dir could become the cache `backend` then restores.
          # Sharing a key without deciding who writes it is the same poisoning bug as
          # letting a Buck2 job save a directory it never populated, one level down.
          save-if: false

      - name: Domain crate unit tests
        if: ${{ needs.preflight.outputs.run_heavy == 'true' }}
        # cargo, not buck2. MEASURED 2026-07-31 on this crate: buck2 cold 118.4s
        # (176 commands, `cached: 0`) versus cargo cold 6.5s. Buck2 is not slower
        # by nature — its warm build is 0.17s — but its warm state CANNOT cross a
        # CI run boundary: the action cache lives in the daemon's in-memory graph,
        # not portably in buck-out. Proven by tarring buck-out, deleting it,
        # restoring it and rebuilding: still `cached: 0`, all 176 commands re-ran.
        # So every buck2 job here was a cold build, every run, with no cache to
        # restore. cargo's target/ does survive, via rust-cache below.
        #
        # --lib is load-bearing on the first command: several of these crates also
        # carry tests/ suites needing PostgreSQL — payroll_lifecycle_rls_as_runtime_role,
        # audit_chain_rls, and authz's policy.rs, each verified to panic in sqlx's test
        # harness without a database. Those belong to postgres-domain-reachability.
        #
        # The later commands name the integration files that need NO database, verified
        # by execution one at a time. Seven crates were added on 2026-07-31 because
        # check:executed-tests measured that 287 of 314 Rust test files reach no workflow
        # step at all, and these were the audit-relevant ones needing no database:
        # the audit chain, the policy and governance domains, the ADR-0021 Cedar
        # strangler's readiness and legacy-only-observation cases, and the 위치정보법
        # location-consent FSM — the only consent mechanism in the repository.
        # 98 tests that previously executed nowhere.
        #
        # The adapter crate is here because its 12 pure #[test] cases — the
        # parse_release_gate half that decides what a stored gate record may parse
        # INTO — ran in NO workflow. The domain half decides whether a parsed gate
        # is satisfied; without the adapter half the release gate is half-proven.
        # They need no database (zero #[sqlx::test]), so they belong in this job.
        # Runs the SAME 15 tests as the retired Buck2 target, verified by count.
        # --locked so a drifted Cargo.lock fails rather than silently resolving.
        #
        # The last six were added on 2026-08-02, and they are here because
        # check:executed-tests could not see them until that same change. It asked
        # whether src/lib.rs itself carried #[cfg(test)], and these crates keep
        # every one of theirs in src/<module>.rs, so their lib binaries were not
        # even in the population that can be reported dark. 61 tests that executed
        # nowhere, all pure, zero #[sqlx::test] — among them workflow/runtime's
        # `unknown_policy_fails_closed` and `delegated_finalize_denies_when_legacy_guard_denies`,
        # and platform/auth's two WebAuthn step-up replay-binding cases. The seventh
        # crate the same measurement exposed, platform/db, is 9 #[sqlx::test] and
        # needs a database, so it is named in executed-tests-baseline.json instead.
        run: |
          # ci-keep-going: run every invocation below; failures are collected and the
          # summary at the end exits 1 if any failed, so these cargo runs still gate the
          # job (scripts/lib/ci-workflow-executables.mjs attributes them accordingly).
          set +e
          failed_count=0
          check_status() {
            local rc=$?
            if [[ $rc -ne 0 ]]; then
              echo "FAILED (exit $rc): $1" >&2
              failed_count=$((failed_count + 1))
            fi
          }
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml --lib \
            -p console-support-domain -p console-payroll-domain -p console-payroll-adapter-postgres \
            -p console-attendance-application -p console-compliance-domain -p console-governance-domain \
            -p console-platform-audit-chain -p console-platform-authz \
            -p console-policy-application -p console-policy-domain \
            -p console-action-inbox-application -p console-intelligence-application -p console-attendance-domain -p console-benefit-application \
            -p console-benefit-domain -p console-comms-application -p console-comms-domain \
            -p console-dispatch-application -p console-dispatch-domain -p console-docs-application \
            -p console-docs-domain -p console-equipment-domain -p console-erp-domain \
            -p console-evaluation-application -p console-evaluation-domain -p console-finance-gl-domain -p console-inspection-domain -p console-messenger-domain -p console-registry-domain -p console-workorder-domain \
            -p console-identity-domain -p console-inbox-application -p console-inbox-domain \
            -p console-inventory-domain -p console-leave-domain -p console-logistics-domain \
            -p console-messenger-application -p console-notices-domain -p console-notifications-domain \
            -p console-ontology-application -p console-ontology-domain -p console-orgchange-domain \
            -p console-recruiting-application -p console-recruiting-domain -p console-reporting-application \
            -p console-reporting-domain -p console-sales-domain -p console-support-application \
            -p console-todos-domain -p console-workflow-domain -p console-workorder-application \
            -p console-analytics-quant-service -p console-attendance-adapter-postgres -p console-attendance-rest \
            -p console-benefit-rest -p console-comms-adapter-imap -p console-comms-adapter-mox \
            -p console-comms-adapter-smtp -p console-comms-credential-cipher -p console-comms-mailbox \
            -p console-comms-rest -p console-compliance-rest -p console-consulting-rest \
            -p console-dispatch-rest -p console-docs-adapter-postgres -p console-docs-rest \
            -p console-evaluation-adapter-postgres -p console-facilities-rest -p console-financial-rest \
            -p console-gate-dev-auth-absence -p console-gate-iac-tier -p console-gate-layer-boundary \
            -p console-gate-tenant-isolation -p console-gate-vendor-lockin -p console-identity-rest \
            -p console-inventory-adapter-postgres -p console-inventory-rest -p console-leave-adapter-postgres \
            -p console-leave-rest -p console-ontology-adapter-postgres -p console-ontology-rest \
            -p console-payroll-rest -p console-platform-email -p console-platform-jobs \
            -p console-platform-push -p console-platform-realtime -p console-platform-request-context \
            -p console-production-rest -p console-reporting-adapter-postgres -p console-support-adapter-postgres \
            -p console-kernel-core -p console-registry-rest -p console-reporting-rest \
            -p console-workflow-runtime-adapter-postgres -p console-workorder-rest \
            -p console-financial-domain -p console-identity-application -p console-integrity \
            -p console-platform-auth -p console-platform-authz-rest -p console-workflow-runtime \
            -p console-logistics-rest -p console-ontology-canonical-domain \
            -p console-ontology-canonical-adapter-postgres -p console-orgchange-adapter-postgres \
            -p console-gate-writer-ownership -p console-identity-adapter-postgres
          check_status "domain --lib sweep"
          # Its own invocation, and deliberately NOT also in the sweep above.
          # The executed-tests ratchet keys a test binary by (crate_root,
          # feature set), and this crate's Buck face declares islands+ssr --
          # the same set Cargo applies by default. An invocation leaving them
          # implicit keys a different binary, so the real one reads as
          # executing nowhere and the ratchet calls it a test that cannot fail.
          # Naming them makes the two identities the same; listing the crate
          # in both places would compile and run the same 8 tests twice and
          # leave a bare key the ratchet cannot see, because it only checks
          # defined-minus-executed.
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml --lib \
            -p console-payroll-ui --features islands,ssr
          check_status "payroll-ui --lib"
          # Doc tests, same step so no new step name has to be declared anywhere.
          # `compile_fail` doctests are the only artifact that can hold a NEGATIVE
          # type-boundary claim ("this must not compile"), and they execute nowhere
          # unless --doc is invoked explicitly.
          # `--workspace`, NOT a package list: this step ran `-p console-kernel-core`
          # from 4a9c7579 until 2026-08-17, and that crate has never contained a
          # single doc fence -- so the gate executed 0 tests every build while 23
          # real doctests went dark, 10 of them `compile_fail` claims guarding
          # ResourceBranch, authorize, authorize_scoped and GrantValidity. A
          # hand-maintained package list is what failed; deriving the set from the
          # workspace is what keeps it from failing again. Do not narrow this back
          # to `-p`.
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            --doc --workspace
          check_status "domain --doc"
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-attendance-application --test attendance_policy
          check_status "attendance_policy"
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-compliance-domain --test location_consent_fsm --test location_ping_policy
          check_status "location_consent_fsm + location_ping_policy"
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-platform-authz --test cedar_pbac_readiness_cases --test cedar_pbac_legacy_only_observe_and_record
          check_status "cedar_pbac"
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-attendance-domain --test range_and_history
          check_status "range_and_history"
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-contracts --test compose
          check_status "compose"
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-todos-rest --test openapi_fragment
          check_status "openapi_fragment"
          # openapi.yaml and typed_action_generated.rs are generated from the
          # semantic manifest + per-face Fragments. Regeneration must be a no-op
          # on a clean tree; a hand-edit that skips the owning source fails this
          # diff. The generator itself refuses to run with fewer than 35
          # fragments (shared + 34 faces) or fewer than 15 codec structs, so an
          # empty registry cannot pass by rewriting nothing.
          SQLX_OFFLINE=true cargo run --locked --manifest-path backend/Cargo.toml \
            -p console-contracts --bin console-openapi-gen
          check_status "openapi regen"
          git diff --exit-code -- backend/openapi/openapi.yaml backend/crates/ontology/rest/src/typed_action_generated.rs
          check_status "openapi diff"
          # ONE -p PER INVOCATION whenever --test is used. Two packages and two --test names on
          # a single line is ambiguous to any reader that pairs them positionally, and
          # check-executed-tests.mjs pairs them as a CROSS PRODUCT — 2x2 candidates where only
          # 2 are real. That produces a FALSE POSITIVE the moment a name exists in both crates,
          # reporting a test as executed when it is not. Under-reporting darkness is the one
          # direction that measurement tool must never fail in, so the ambiguity is removed at
          # the source rather than parsed around.
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-financial-domain --test quote_and_residual
          check_status "quote_and_residual"
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-registry-domain --test equipment
          check_status "equipment"
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-messenger-domain --test mentions --test object_code_refs --test parity --test thread_kind
          check_status "messenger"
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-workorder-domain --test approval_and_assignment --test serde_roundtrips \
            --test settlement_fsm --test workorder_fsm
          check_status "workorder"
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-platform-auth --test jwt_es256 --test jwt_verifier --test well_known
          check_status "jwt"
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-platform-excel --test template_fidelity --test template_fill_engine
          check_status "excel"
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-platform-realtime --test hub --test notify_payload
          check_status "realtime"
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-app --test config --test dev_seed_notification_links --test openslo_files \
            --test well_known --test workbench_api --test intelligence_bind
          check_status "app"
          # The writer-ownership gate's mutation suite. It lives here and not in
          # the backend job's Buck2 mutation-suite step because 3 of its 41 tests
          # read THIS repository -- the whole backend crate tree, and
          # ops/postgres-reconcile-topology.sh -- which a Buck2 action does not
          # materialize. A real checkout is the requirement, and this job has one.
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-gate-writer-ownership --test gate_detects_violation
          check_status "gate_detects_violation"
          if [[ $failed_count -ne 0 ]]; then
            echo "domain-unit: $failed_count invocation(s) failed" >&2
            exit 1
          fi
          echo "domain-unit: all invocations passed"

  # PostgreSQL reachability facets (S1 + S2 domain split). Package partition via --shard-id.
  # Do NOT put the load-bearing branch-protection display name on these jobs
