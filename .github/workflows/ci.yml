  postgres-reachability-app:
    name: Test PostgreSQL — app
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 45
    env:
      # MUST match the cache writer (`backend`). rust-cache folds every CARGO_*
      # variable present into its environment hash, and `backend` is the only
      # job that set these two -- so the shards computed a different key and
      # could never restore the entry `backend` saves. Measured 2026-08-18 on
      # run 32108350947: shard domain-b asked for ...-b587c171- while main held
      # ...-f3304cdf- (identical lockfile half), logged "No cache found." and
      # recompiled 925 crates in 195s.
      #
      # CARGO_INCREMENTAL and CARGO_TERM_COLOR are NOT listed here on purpose:
      # dtolnay/rust-toolchain already writes both into GITHUB_ENV for every job
      # that uses it, so both sides already agreed on them. Setting them here
      # changed nothing, which is exactly how the first attempt at this fix
      # failed -- it aligned two variables that were never misaligned.
      #
      # These two are also not merely hash cosmetics: a target dir built WITH
      # debug info cannot be reused by a build that wants it off, so matching
      # the writer's profile is what makes the restored cache actually usable.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Path-class skip proof
        if: ${{ needs.preflight.outputs.run_live_postgres != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'path-class skip proof: %s not required for class=%s\n' "${GITHUB_JOB}" "${{ needs.preflight.outputs.path_class }}"
      - name: Checkout
        if: ${{ needs.preflight.outputs.run_live_postgres == 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
