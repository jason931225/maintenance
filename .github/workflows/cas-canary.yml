# Warm cache for CI. Deliberately NOT a required context and not referenced by
# check-ci-preflight or check-foundation-gates: Buck2 hard-fails when a configured
# CAS is unreachable, so a build cache must never be able to fail Required CI.
#
# Durability model:
#   push:dev     -> build and SAVE. Default-branch caches are readable from every
#                    branch and PR, so one save serves everyone.
#   pull_request  -> RESTORE only. A PR never writes, so no PR can spend the shared
#                    ~10 GB Actions budget (cache-hygiene.yml hard-fails above 8 GiB).
name: CAS canary

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fallback:
    name: Warm cache degrades to local
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: { persist-credentials: false }
      - name: Preflight against an endpoint that is not there
        id: cas
        uses: ./.github/actions/cas-warm
        with: { endpoint: "127.0.0.1:59999", role: reader }
      - name: A cache outage must not fail the build
        env:
          CAS_UP: ${{ steps.cas.outputs.cas-up }}
          FLAGS: ${{ steps.cas.outputs.flags }}
        run: |
          [ "$CAS_UP" = "0" ] || { echo "expected the probe to report down"; exit 1; }
          [ "$FLAGS" = "--no-remote-cache" ] || { echo "expected the fallback flag"; exit 1; }
          [ ! -f .buckconfig.local ] || { echo "unreachable cache must not leave RE config"; exit 1; }
          echo "OK: cold path selected, build may proceed locally"

  seed:
    name: Seed the durable cache (dev only)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: { persist-credentials: false }
      - uses: ./.github/actions/buck2-setup
      - uses: ./.github/actions/cas-inrunner
        id: cas
      - uses: ./.github/actions/cas-warm
        id: warm
        with: { endpoint: "127.0.0.1:50051", role: writer }
      - name: Build the gate Required CI runs
        run: |
          set -o pipefail
          tools/buck2 --isolation-dir ci build --config-file infra/ci/buckconfig/warm-cache.buckconfig \
            ${{ steps.warm.outputs.flags }} \
            //backend/ci/gates/layer-boundary:console-gate-layer-boundary --console=simple 2>&1 \
            | tee "${RUNNER_TEMP}/buck-seed.log" | tail -50
      - name: Store size
        run: du -sh ~/nativelink-cas || true
      # A build failure here prints only its last lines, and the CAS server's
      # own log is never surfaced at all -- so a failure that is not the
      # assertion this job makes costs an investigation with no evidence.
      # `${{ github.run_attempt }}` in the name, not `overwrite: true`. A job
      # re-run keeps the same run_id, so a fixed name collides on the second
      # attempt: the action's default refuses and reds a job whose build and
      # assertion both passed, while `overwrite: true` DELETES the earlier
      # attempt -- which on the canonical flake (fails, re-run, passes) throws
      # away the failing log this workflow exists to keep. A per-attempt name
      # avoids the collision and keeps every attempt.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cas-canary-seed-logs-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/buck-seed.log
            ${{ runner.temp }}/nativelink.log
          if-no-files-found: ignore
          # Matches the repo's only other artifacts (image-release.yml). These
          # upload on every push to every PR and the tee'd buck log is
          # unbounded; nothing prunes artifacts, so the bound is the retention.
          retention-days: 1
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/nativelink-cas
          # Saved under the prefix cas-inrunner RESTORED from, which names the
          # compiler. A literal here would drift from the restore side the first
          # time the toolchain rolls, and the store would go back to mixing
          # artifacts from two compilers -- #1083.
          key: ${{ steps.cas.outputs.key-prefix }}${{ github.run_id }}

  consume:
    name: A PR reuses what dev seeded
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Read-only. The verdict below asks the cache list which of three
      # situations produced an empty restore; without it they are
      # indistinguishable and all three read as green.
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: { persist-credentials: false }
      - uses: ./.github/actions/buck2-setup
      - uses: ./.github/actions/cas-inrunner
        id: cas
      - uses: ./.github/actions/cas-warm
        id: warm
        with: { endpoint: "127.0.0.1:50051", role: reader }
      - name: Build, and require hits when a seeded cache was restored
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MY_PREFIX: ${{ steps.cas.outputs.key-prefix }}
          # Through env, not inline `${{ }}` in the run block. Not exploitable
          # here -- a cache key cannot carry free text -- but it is the classic
          # injection shape, and MY_PREFIX one line up already does it right.
          RESTORED_KEY: ${{ steps.cas.outputs.restored-key }}
        run: |
          set -o pipefail
          tools/buck2 --isolation-dir ci build --config-file infra/ci/buckconfig/warm-cache.buckconfig \
            ${{ steps.warm.outputs.flags }} \
            //backend/ci/gates/layer-boundary:console-gate-layer-boundary --console=simple 2>&1 \
            | tee "${RUNNER_TEMP}/buck-consume.log" | tail -50
          echo "--- verdict ---"
          # gh's exit status is the signal: a readable list lets the verdict tell
          # a missing seed from a broken one, an unreadable list does not, and
          # those are different answers. See scripts/cas/canary-verdict.sh.
          # stderr is NOT discarded. A permanent failure (a 403 from an org
          # policy or token-scope change) and a transient 502 both land in the
          # else branch and print COULD NOT DETERMINE, and without the error
          # text they are indistinguishable forever -- which is how this fix
          # would quietly become a no-op that still looks like a fix.
          if gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
               -q '.actions_caches[].key' > "${RUNNER_TEMP}/cache-keys.txt"; then
            scripts/cas/canary-verdict.sh \
              --restored "${RESTORED_KEY}" \
              --prefix "${MY_PREFIX}" \
              --log "${RUNNER_TEMP}/buck-consume.log" \
              --keys "${RUNNER_TEMP}/cache-keys.txt"
          else
            scripts/cas/canary-verdict.sh \
              --restored "${RESTORED_KEY}" \
              --prefix "${MY_PREFIX}" \
              --log "${RUNNER_TEMP}/buck-consume.log"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cas-canary-consume-logs-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/buck-consume.log
            ${{ runner.temp }}/nativelink.log
          if-no-files-found: ignore
          # Matches the repo's only other artifacts (image-release.yml). These
          # upload on every push to every PR and the tee'd buck log is
          # unbounded; nothing prunes artifacts, so the bound is the retention.
          retention-days: 1

  prune:
    name: Keep the shared cache budget bounded
    needs: [seed]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      # This job needed no repo files while the policy was an inline jq
      # expression. It does now, which is the price of making the policy
      # testable -- and a price worth naming rather than leaving as a mystery
      # checkout in a job that otherwise only talks to the API.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # This is the only `actions: write` job here -- it can delete caches --
          # and it needs exactly one 86-line script, so it takes neither the
          # credentials nor the rest of the tree. Every other checkout in this
          # file already passes persist-credentials: false.
          sparse-checkout: scripts/cas
          persist-credentials: false
      - name: Retain the newest CAS cache per compiler
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `shell: bash` and this line together are load-bearing. GitHub's
          # default shell is `bash -e {0}`, WITHOUT pipefail, so in
          # `gh api ... | node prune-plan.mjs | while read`, a failure in either
          # of the first two stages is swallowed and the step exits 0 having
          # deleted nothing. The script's own fail-closed `exit 1` on an
          # unparseable payload -- and any `gh api` 403 or 502 -- would have
          # been invisible, leaving a silent no-op that looks green forever.
          set -o pipefail
          # cache-hygiene.yml holds the repo to an 8 GiB soft budget and hard-fails
          # above it, so this deletes eagerly rather than waiting for the daily
          # protocol. WHICH caches to delete is decided per prefix, not globally.
          #
          # The prefix names the compilers whose artifacts a store holds, so it is
          # multi-valued: a toolchain roll, or two runner images with different
          # clang, puts several live prefixes in the repo at once. The previous
          # rule sorted every cache by age and kept the two newest, prefix-blind,
          # so both survivors could belong to ONE prefix -- and the other lost its
          # only seed, leaving every job on that compiler to build cold (#1089).
          #
          # The decision lives in a script with tests because it is a retention
          # policy, and the shape of this bug -- a rule that looks right in a jq
          # one-liner and silently evicts the wrong thing -- is exactly what an
          # inline expression in a workflow cannot be tested for.
          # --paginate --slurp, because a single page silently under-prunes the
          # moment the repo holds more than 100 caches -- which is exactly when
          # the 8 GiB budget needs this job most. Truncation cannot destroy an
          # unseen prefix's seed (a prefix absent from the page contributes no
          # caches, so nothing can be planned for it), so the failure is a quiet
          # no-op rather than a wrong deletion. --slurp yields an array of pages;
          # the jq flattens them back into one payload of the shape the script
          # reads.
          # `--slurp` is rejected alongside `--jq` ("the --slurp option is not
          # supported with --jq or --template"), so the flattening is a separate
          # jq stage. Verified against the live API, which is also why this is a
          # pipe rather than the one-liner it looks like it should be.
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
          | jq '{actions_caches: map(.actions_caches[])}' \
          | node scripts/cas/prune-plan.mjs \
          | while read -r id key size; do
              echo "deleting $key ($((size/1048576)) MiB)"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" || true
            done
          gh api "repos/${GITHUB_REPOSITORY}/actions/cache/usage" \
            -q '"usage now: \(.active_caches_size_in_bytes/1073741824*100|round/100) GiB across \(.active_caches_count) caches"'
