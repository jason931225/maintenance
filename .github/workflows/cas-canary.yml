# Warm cache for CI. Deliberately NOT a required context and not referenced by
# check-ci-preflight or check-foundation-gates: Buck2 hard-fails when a configured
# CAS is unreachable, so a build cache must never be able to fail Required CI.
#
# Durability model:
#   push:dev     -> build and SAVE. Default-branch caches are readable from every
#                    branch and PR, so one save serves everyone.
#   pull_request  -> RESTORE only. A PR never writes, so no PR can spend the shared
#                    ~10 GB Actions budget (cache-hygiene.yml hard-fails above 8 GiB).
name: CAS canary

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fallback:
    name: Warm cache degrades to local
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: { persist-credentials: false }
      - name: Preflight against an endpoint that is not there
        id: cas
        uses: ./.github/actions/cas-warm
        with: { endpoint: "127.0.0.1:59999", role: reader }
      - name: A cache outage must not fail the build
        env:
          CAS_UP: ${{ steps.cas.outputs.cas-up }}
          FLAGS: ${{ steps.cas.outputs.flags }}
        run: |
          [ "$CAS_UP" = "0" ] || { echo "expected the probe to report down"; exit 1; }
          [ "$FLAGS" = "--no-remote-cache" ] || { echo "expected the fallback flag"; exit 1; }
          [ ! -f .buckconfig.local ] || { echo "unreachable cache must not leave RE config"; exit 1; }
          echo "OK: cold path selected, build may proceed locally"

  seed:
    name: Seed the durable cache (dev only)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: { persist-credentials: false }
      - uses: ./.github/actions/buck2-setup
      - uses: ./.github/actions/cas-inrunner
      - uses: ./.github/actions/cas-warm
        id: warm
        with: { endpoint: "127.0.0.1:50051", role: writer }
      - name: Build the gate Required CI runs
        run: |
          set -o pipefail
          tools/buck2 --isolation-dir ci build --config-file infra/ci/buckconfig/warm-cache.buckconfig \
            ${{ steps.warm.outputs.flags }} \
            //backend/ci/gates/layer-boundary:console-gate-layer-boundary --console=simple 2>&1 \
            | tee "${RUNNER_TEMP}/buck-seed.log" | tail -50
      - name: Store size
        run: du -sh ~/nativelink-cas || true
      # A build failure here prints only its last lines, and the CAS server's
      # own log is never surfaced at all -- so a failure that is not the
      # assertion this job makes costs an investigation with no evidence.
      # `${{ github.run_attempt }}` in the name, not `overwrite: true`. A job
      # re-run keeps the same run_id, so a fixed name collides on the second
      # attempt: the action's default refuses and reds a job whose build and
      # assertion both passed, while `overwrite: true` DELETES the earlier
      # attempt -- which on the canonical flake (fails, re-run, passes) throws
      # away the failing log this workflow exists to keep. A per-attempt name
      # avoids the collision and keeps every attempt.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cas-canary-seed-logs-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/buck-seed.log
            ${{ runner.temp }}/nativelink.log
          if-no-files-found: ignore
          # Matches the repo's only other artifacts (image-release.yml). These
          # upload on every push to every PR and the tee'd buck log is
          # unbounded; nothing prunes artifacts, so the bound is the retention.
          retention-days: 1
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/nativelink-cas
          key: nativelink-cas-linux-x64-${{ github.run_id }}

  consume:
    name: A PR reuses what dev seeded
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: { persist-credentials: false }
      - uses: ./.github/actions/buck2-setup
      - uses: ./.github/actions/cas-inrunner
        id: cas
      - uses: ./.github/actions/cas-warm
        id: warm
        with: { endpoint: "127.0.0.1:50051", role: reader }
      - name: Build, and require hits when a seeded cache was restored
        run: |
          set -o pipefail
          tools/buck2 --isolation-dir ci build --config-file infra/ci/buckconfig/warm-cache.buckconfig \
            ${{ steps.warm.outputs.flags }} \
            //backend/ci/gates/layer-boundary:console-gate-layer-boundary --console=simple 2>&1 \
            | tee "${RUNNER_TEMP}/buck-consume.log" | tail -50
          echo "--- verdict ---"
          if [ -z "${{ steps.cas.outputs.restored-key }}" ]; then
            # No dev-seeded cache exists yet. Report it; do not invent a pass or a failure.
            echo "NO SEEDED CACHE YET — nothing to reuse. This becomes a real assertion once dev has seeded one."
            grep -E 'Cache hits|Commands:' "${RUNNER_TEMP}/buck-consume.log" || true
            exit 0
          fi
          if grep -qE 'Cache hits: (100|[1-9][0-9])%' "${RUNNER_TEMP}/buck-consume.log"; then
            echo "OK: this PR reused the cache dev seeded"
          else
            echo "REGRESSION: a seeded cache was restored but produced no hits"
            grep -E 'Cache hits|Commands:' "${RUNNER_TEMP}/buck-consume.log" || true
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cas-canary-consume-logs-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/buck-consume.log
            ${{ runner.temp }}/nativelink.log
          if-no-files-found: ignore
          # Matches the repo's only other artifacts (image-release.yml). These
          # upload on every push to every PR and the tee'd buck log is
          # unbounded; nothing prunes artifacts, so the bound is the retention.
          retention-days: 1

  prune:
    name: Keep the shared cache budget bounded
    needs: [seed]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Retain only the newest CAS caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # cache-hygiene.yml holds the repo to an 8 GiB soft budget and hard-fails
          # above it. Keep the two newest seeds so a restore always has a target,
          # and delete the rest rather than waiting for the daily protocol.
          gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            -q '[.actions_caches[] | select(.key|startswith("nativelink-cas-"))] | sort_by(.created_at) | reverse | .[2:] | .[] | "\(.id) \(.key) \(.size_in_bytes)"' \
          | while read -r id key size; do
              echo "deleting $key ($((size/1048576)) MiB)"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" || true
            done
          gh api "repos/${GITHUB_REPOSITORY}/actions/cache/usage" \
            -q '"usage now: \(.active_caches_size_in_bytes/1073741824*100|round/100) GiB across \(.active_caches_count) caches"'
